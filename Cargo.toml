[package]
name = "dynamic-island"
version = "0.1.1"
edition = "2021"
description = "WowIsland : une Dynamic Island pour Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
once_cell = "1"
chrono = "0.4"
parking_lot = "0.12"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.16"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd"] }
plist = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
ring = "0.17"
rqrr = { version = "0.9", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rsa = { version = "0.9", features = ["std", "pem"] }

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Media_Core",
  "Media_Playback",
  "Storage",
  "Storage_FileProperties",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Wmi",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Services",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_FileSystem",
  "Management_Deployment",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
