<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.48" stop-color="#9b4dff"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="0.75" cy="1" r="0.8">
      <stop offset="0" stop-color="#2a0a4a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a0a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="0.6" stop-color="#030304"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd8c9"/>
      <stop offset="1" stop-color="#7cf29a"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sq"><rect x="40" y="40" width="944" height="944" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#deep)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#shine)"/>
    <!-- soft halo taking the cover color, like the island does with album art -->
    <ellipse cx="512" cy="540" rx="380" ry="190" fill="#ff7a59" opacity="0.28" filter="url(#glow)"/>
  </g>
  <rect x="40.5" y="40.5" width="943" height="943" rx="228" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- the island -->
  <g filter="url(#drop)">
    <rect x="132" y="392" width="760" height="256" rx="128" fill="url(#pill)"/>
  </g>
  <rect x="134" y="394" width="756" height="252" rx="126" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- album cover -->
  <rect x="200" y="440" width="160" height="160" rx="44" fill="url(#cover)"/>
  <circle cx="280" cy="520" r="34" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="280" cy="520" r="11" fill="#ffffff" fill-opacity="0.75"/>

  <!-- equalizer -->
  <g fill="url(#bars)">
    <rect x="606" y="476" width="34" height="88" rx="17"/>
    <rect x="660" y="430" width="34" height="180" rx="17"/>
    <rect x="714" y="458" width="34" height="124" rx="17"/>
    <rect x="768" y="494" width="34" height="52" rx="17"/>
  </g>
</svg>
