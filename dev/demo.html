  async function runScene() {
    if (!SCENE || !SCENES[SCENE]) return;
    // captures : les alertes passagères restent plus longtemps, le temps de les photographier
    const push = pushTransient;
    pushTransient = (k, d, ms) => push(k, d, ms * 4);
    await SCENES[SCENE]();
    window.__sceneDone = true;
  }
