<!doctype html>
<!-- Bannière du README : rendue en PNG par dev/shots.mjs. ?lang=fr pour la version française. -->
<html><head><meta charset="utf-8"><title>WowIsland banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 600px; overflow: hidden; background: #000; }
  body {
    font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: #f5f5f7; position: relative; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  /* lumière très légère venue de l'île, teinte de la pochette */
  .light { position: absolute; left: 50%; top: -260px; width: 1000px; height: 640px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255, 86, 120, .13), rgba(255, 86, 120, .04) 55%, transparent); }
  .shot { position: absolute; left: 50%; top: 22px; width: 528px; transform: translateX(-50%); }
  .shot img { display: block; width: 100%; }
  .text { position: absolute; left: 0; right: 0; top: 384px; }
  .eyebrow { font-size: 19px; font-weight: 600; letter-spacing: .01em; color: #f5f5f7; }
  .eyebrow span { color: #86868b; font-weight: 500; }
  h1 { margin-top: 14px; font-size: 62px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; color: #f5f5f7; }
  p { margin: 20px auto 0; max-width: 760px; font-size: 21px; line-height: 1.45; font-weight: 400; color: #86868b; letter-spacing: -0.005em; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); }
</style></head>
<body>
  <div class="light"></div>
  <div class="shot"><img id="p" src="shots/en/player-crop.png" alt=""></div>
  <div class="text">
    <div class="eyebrow">WowIsland <span id="for">for Windows</span></div>
    <h1 id="h">The island Windows was missing.</h1>
    <p id="s">Music and lyrics, 2FA codes, notifications and downloads.<br>All in one place, at the top of your screen.</p>
  </div>
  <div class="rule"></div>
<script>
  if (new URLSearchParams(location.search).get("lang") === "fr") {
    document.documentElement.lang = "fr";
    document.getElementById("for").textContent = "pour Windows";
    document.getElementById("h").textContent = "L’île qui manquait à Windows.";
    document.getElementById("s").innerHTML = "Musique et paroles, codes 2FA, notifications et téléchargements.<br>Tout au même endroit, en haut de l’écran.";
    document.getElementById("p").src = "shots/fr/player-crop.png";
  }
  document.fonts.ready.then(() => { window.__sceneDone = true; });
</script>
</body></html>
